# fangcunmount.cn / www.fangcunmount.cn —— 官方首页（纯静态站点）
# 注意：本文件被包含于 http{} 内

server {
    listen 443 ssl;
    server_name fangcunmount.cn;

    ssl_certificate     /data/ssl/certs/fangcunmount.cn.crt;
    ssl_certificate_key /data/ssl/private/fangcunmount.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 5m;

    return 301 https://www.fangcunmount.cn$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.fangcunmount.cn;

    ssl_certificate     /data/ssl/certs/fangcunmount.cn.crt;
    ssl_certificate_key /data/ssl/private/fangcunmount.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 5m;

    root /data/www/www.fangcunmount.cn;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name fangcunmount.cn www.fangcunmount.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.fangcunmount.cn$request_uri;
    }
}
