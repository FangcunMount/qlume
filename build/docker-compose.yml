version: "3.8"

services:
  qlume:
    image: ${QLUME_IMAGE:?Set QLUME_IMAGE to an exact sha tag}
    container_name: qlume
    ports:
      - "${APP_PORT_SERVERB:-9099}:3000"
    restart: unless-stopped
    networks:
      infra-network:
        aliases:
          - qlume

networks:
  infra-network:
    external: true
