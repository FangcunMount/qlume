name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      deploy:
        description: "是否部署到 ServerB（只允许 main/master 分支）"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: qlume-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/fangcunmount/qlume
  IMAGE_DOCKERHUB: fangcunmount/qlume
  DOCKERFILE: build/Dockerfile

jobs:
  validate-secrets:
    name: Validate Secrets
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check required secrets
        shell: bash
        env:
          # HOST/USERNAME/PORT 优先用 org Variables，SSH 密钥仍走 Secrets
          SVRB_HOST: ${{ secrets.SVRB_HOST || vars.SVRB_HOST }}
          SVRB_USERNAME: ${{ secrets.SVRB_USERNAME || vars.SVRB_USERNAME }}
          SVRB_SSH_KEY: ${{ secrets.SVRB_SSH_KEY }}
          SVRB_SSH_PORT: ${{ secrets.SVRB_SSH_PORT || vars.SVRB_SSH_PORT }}
          SVRB_HOST_FINGERPRINT: ${{ secrets.SVRB_HOST_FINGERPRINT }}
          APP_PORT_SERVERB: ${{ secrets.APP_PORT_SERVERB || vars.APP_PORT_SERVERB }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          ENFORCE_REQUIRED=0
          VALIDATION_FAILED=0

          if [ "${GITHUB_REF}" = "refs/heads/main" ] || [ "${GITHUB_REF}" = "refs/heads/master" ]; then
            ENFORCE_REQUIRED=1
            echo "main/master 分支：严格校验部署必需配置"
          else
            echo "非 main/master 分支：仅提示缺失，不阻断"
          fi

          REQUIRED_SECRETS=(SVRB_HOST SVRB_USERNAME SVRB_SSH_KEY SVRB_HOST_FINGERPRINT)
          OPTIONAL_SECRETS=(SVRB_SSH_PORT APP_PORT_SERVERB DOCKERHUB_USERNAME DOCKERHUB_TOKEN)

          for SECRET_NAME in "${REQUIRED_SECRETS[@]}"; do
            VALUE="${!SECRET_NAME:-}"
            if [ -n "$VALUE" ]; then
              echo "OK: ${SECRET_NAME} is set"
            else
              if [ "$ENFORCE_REQUIRED" -eq 1 ]; then
                echo "ERROR: ${SECRET_NAME} is not set"
                VALIDATION_FAILED=1
              else
                echo "WARN: ${SECRET_NAME} is not set (required on main/master deploy)"
              fi
            fi
          done

          for SECRET_NAME in "${OPTIONAL_SECRETS[@]}"; do
            VALUE="${!SECRET_NAME:-}"
            if [ -n "$VALUE" ]; then
              echo "OK: ${SECRET_NAME} is set"
            else
              case "$SECRET_NAME" in
                SVRB_SSH_PORT)
                  echo "WARN: ${SECRET_NAME} is not set, fallback to 22"
                  ;;
                APP_PORT_SERVERB)
                  echo "WARN: ${SECRET_NAME} is not set, fallback to 9099"
                  ;;
                DOCKERHUB_TOKEN|DOCKERHUB_USERNAME)
                  echo "WARN: ${SECRET_NAME} is not set — GHCR 失败时无法回退 Docker Hub"
                  ;;
                *)
                  echo "WARN: ${SECRET_NAME} is not set (optional)"
                  ;;
              esac
            fi
          done

          if [ "$ENFORCE_REQUIRED" -eq 1 ] && [ "$VALIDATION_FAILED" -eq 1 ]; then
            echo "Secrets validation failed."
            exit 1
          fi
          echo "Secrets validation passed."

  test_lint:
    name: Test And Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker_build_push:
    name: Build And Push Image
    needs: [validate-secrets, test_lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: image_meta
        shell: bash
        run: |
          set -Eeuo pipefail
          TAGS="${IMAGE}:sha-${GITHUB_SHA}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ] || [ "${GITHUB_REF}" = "refs/heads/master" ]; then
            TAGS="${TAGS}"$'\n'"${IMAGE}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build And Push GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: ${{ steps.image_meta.outputs.tags }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_REF=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Mirror image to Docker Hub (optional)
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "Docker Hub credentials missing, skip mirror."
            exit 0
          fi
          if ! echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin; then
            echo "Docker Hub login failed, skip mirror."
            exit 0
          fi
          if ! docker buildx imagetools create -t "${IMAGE_DOCKERHUB}:sha-${GITHUB_SHA}" "${IMAGE}:sha-${GITHUB_SHA}"; then
            echo "Mirror sha tag failed, keep GHCR as source of truth."
            exit 0
          fi
          if [ "${GITHUB_REF}" = "refs/heads/main" ] || [ "${GITHUB_REF}" = "refs/heads/master" ]; then
            if ! docker buildx imagetools create -t "${IMAGE_DOCKERHUB}:latest" "${IMAGE}:latest"; then
              echo "Mirror latest tag failed, keep GHCR as source of truth."
              exit 0
            fi
          fi

  deploy_serverb:
    name: Deploy To ServerB
    needs: [docker_build_push]
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64]
    permissions:
      contents: read
      packages: read
    environment: production
    concurrency:
      group: qlume-production
      cancel-in-progress: false
    if: |
      ((github.event_name == 'push') &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      ((github.event_name == 'workflow_dispatch' && inputs.deploy) &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    steps:
      - name: Login GHCR (isolated config, no keychain)
        shell: bash
        env:
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          # macOS 上 docker login 即使 config 没配 credsStore，只要 PATH 里有
          # docker-credential-osxkeychain 也会默认走钥匙串，无 GUI 会话会失败
          # (-25308)。因此不跑 docker login，直接把 auth 写进隔离配置。
          ARTIFACT_DIR="${RUNNER_TEMP}/qlume-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          umask 077
          mkdir -p "$ARTIFACT_DIR"
          chmod 700 "$ARTIFACT_DIR"
          echo "ARTIFACT_DIR=$ARTIFACT_DIR" >> "$GITHUB_ENV"
          DOCKER_CONFIG_DIR="${ARTIFACT_DIR}/docker-config"
          mkdir -p "${DOCKER_CONFIG_DIR}"
          AUTH="$(printf '%s:%s' "${GH_USER}" "${GH_TOKEN}" | base64 | tr -d '\n')"
          umask 077
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "${AUTH}" > "${DOCKER_CONFIG_DIR}/config.json"
          echo "DOCKER_CONFIG=${DOCKER_CONFIG_DIR}" >> "${GITHUB_ENV}"

      - name: Prepare SSH key
        shell: bash
        env:
          # 使用仓库专用 serverB deploy key，不回退到 serverD 或 runner 私人密钥
          SSH_KEY: ${{ secrets.SVRB_SSH_KEY }}
          HOST: ${{ secrets.SVRB_HOST || vars.SVRB_PUBLIC_HOST || vars.SVRB_HOST }}
          PORT: ${{ secrets.SVRB_SSH_PORT || vars.SVRB_SSH_PORT || 22 }}
          HOST_FINGERPRINT: ${{ secrets.SVRB_HOST_FINGERPRINT }}
        run: |
          set -Eeuo pipefail
          # 写到 RUNNER_TEMP 独立路径，避免覆盖 runner 用户 ~/.ssh 下的个人密钥
          KEY_PATH="${ARTIFACT_DIR}/deploy_key"
          umask 077
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "${KEY_PATH}"
          chmod 600 "${KEY_PATH}"
          ssh-keygen -lf "${KEY_PATH}"
          echo "SSH_KEY_PATH=${KEY_PATH}" >> "${GITHUB_ENV}"
          KNOWN_HOSTS="${ARTIFACT_DIR}/known_hosts"
          ssh-keyscan -T 10 -p "$PORT" -t ed25519 "$HOST" > "$KNOWN_HOSTS"
          ACTUAL=$(ssh-keygen -lf "$KNOWN_HOSTS" -E sha256 | awk '{print $2}')
          test "$ACTUAL" = "$HOST_FINGERPRINT" || { echo "Host fingerprint mismatch" >&2; exit 1; }
          echo "SSH_KNOWN_HOSTS=$KNOWN_HOSTS" >> "$GITHUB_ENV"

      - name: Pull image on runner and export bundle
        env:
          IMAGE_REF: ${{ env.IMAGE }}:sha-${{ github.sha }}
        run: |
          set -Eeuo pipefail
          # Mac Runner 为 ARM64，serverB 为 linux/amd64，必须指定平台
          docker pull --platform linux/amd64 "${IMAGE_REF}"
          docker save "${IMAGE_REF}" | gzip -1 > "${ARTIFACT_DIR}/qlume-image.tar.gz"
          ls -lh "${ARTIFACT_DIR}/qlume-image.tar.gz"

      - name: Upload image bundle to ServerB
        shell: bash
        env:
          # 大文件走公网：Tailscale DERP 中继太慢（~50KB/s）；打洞成功前优先公网
          HOST: ${{ secrets.SVRB_HOST || vars.SVRB_PUBLIC_HOST || vars.SVRB_HOST }}
          DEPLOY_USER: ${{ secrets.SVRB_USERNAME || vars.SVRB_USERNAME }}
          PORT: ${{ secrets.SVRB_SSH_PORT || vars.SVRB_SSH_PORT || 22 }}
        run: |
          set -Eeuo pipefail
          echo "Uploading bundle to ${DEPLOY_USER}@${HOST}:${PORT}"
          scp -i "${SSH_KEY_PATH}" -P "${PORT}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${SSH_KNOWN_HOSTS}" -o HostKeyAlgorithms=ssh-ed25519 \
            "${ARTIFACT_DIR}/qlume-image.tar.gz" "${DEPLOY_USER}@${HOST}:/opt/qlume/image-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"

      - name: Deploy to ServerB
        shell: bash
        env:
          HOST: ${{ secrets.SVRB_HOST || vars.SVRB_PUBLIC_HOST || vars.SVRB_HOST }}
          DEPLOY_USER: ${{ secrets.SVRB_USERNAME || vars.SVRB_USERNAME }}
          PORT: ${{ secrets.SVRB_SSH_PORT || vars.SVRB_SSH_PORT || 22 }}
          IMAGE: ${{ env.IMAGE }}
          IMAGE_SHA: ${{ github.sha }}
          APP_PORT_SERVERB: ${{ secrets.APP_PORT_SERVERB || vars.APP_PORT_SERVERB }}
        run: |
          set -Eeuo pipefail

          SSH_OPTS=(-i "$SSH_KEY_PATH" -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS" -o HostKeyAlgorithms=ssh-ed25519)
          echo "Connecting to ${DEPLOY_USER}@${HOST}:${PORT}"

          [[ "${APP_PORT_SERVERB:-9099}" =~ ^[0-9]+$ ]] || exit 1
          # The client expands only the fixed image/ref, numeric port and unique bundle path.
          # shellcheck disable=SC2029
          cat <<'REMOTE_SCRIPT' | ssh "${SSH_OPTS[@]}" "${DEPLOY_USER}@${HOST}" "IMAGE=${IMAGE} IMAGE_SHA=${IMAGE_SHA} APP_PORT_SERVERB='${APP_PORT_SERVERB}' BUNDLE=/opt/qlume/image-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz bash -s"
          set -Eeuo pipefail

          CONTAINER_NAME="qlume"
          NETWORK_NAME="infra-network"
          IMAGE_NAME="${IMAGE}:sha-${IMAGE_SHA}"
          APP_PORT="3000"
          HOST_PORT="${APP_PORT_SERVERB:-9099}"
          PREV_IMAGE=""
          USE_IMAGE="${IMAGE_NAME}"

          test "$(hostname -s)" = serverB || { echo "Unexpected deployment host" >&2; exit 1; }
          [[ "$HOST_PORT" =~ ^[0-9]+$ ]] && (( HOST_PORT > 0 && HOST_PORT < 65536 )) || exit 1
          exec 9>/opt/qlume/.deploy.lock
          flock -w 900 9 || { echo "Another deployment holds the lock" >&2; exit 1; }

          if ! command -v docker >/dev/null 2>&1; then
            echo "ServerB 缺少 docker，无法部署容器" >&2
            exit 1
          fi
          docker info >/dev/null
          TEMP_TAR=""
          trap 'rm -f -- "${TEMP_TAR:-}" "$BUNDLE"' EXIT

          if [ ! -f "${BUNDLE}" ]; then
            echo "未找到镜像包 ${BUNDLE}" >&2
            exit 1
          fi
          if ! gzip -t "${BUNDLE}" 2>/dev/null; then
            echo "镜像包损坏或未传完整（gzip 校验失败）" >&2
            exit 1
          fi

          TEMP_TAR="$(mktemp)"
          gunzip -c "${BUNDLE}" > "${TEMP_TAR}"
          docker load -i "${TEMP_TAR}"
          rm -f "${TEMP_TAR}" "${BUNDLE}"

          test "$(docker image inspect "$IMAGE_NAME" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$IMAGE_SHA" || { echo "Image revision mismatch" >&2; exit 1; }
          test "$(docker image inspect "$IMAGE_NAME" --format '{{.Architecture}}')" = amd64 || exit 1

          if ! docker network ls --format '{{.Name}}' | grep -q "^${NETWORK_NAME}$"; then
            echo "Network ${NETWORK_NAME} not found. Initialize ServerB Swarm/infra-network first." >&2
            exit 1
          fi

          if docker ps -a --format '{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then
            PREV_IMAGE="$(docker inspect --format '{{.Config.Image}}' "${CONTAINER_NAME}" 2>/dev/null || true)"
            if [ -n "${PREV_IMAGE}" ]; then
              echo "Previous image detected: ${PREV_IMAGE}"
            fi
            docker stop "${CONTAINER_NAME}" || true
            docker rm "${CONTAINER_NAME}" || true
          fi

          echo "Run container: ${CONTAINER_NAME}"
          HEALTH_OK=0
          if docker run -d \
            --name "${CONTAINER_NAME}" \
            --network "${NETWORK_NAME}" \
            --network-alias "qlume" \
            --restart unless-stopped \
            -p ${HOST_PORT}:${APP_PORT} \
            "${USE_IMAGE}"; then

          echo "Health check (docker exec -> http://127.0.0.1:${APP_PORT}/)..."
          sleep 5
          for i in $(seq 1 45); do
            if docker exec "${CONTAINER_NAME}" wget -qO- -T 3 "http://127.0.0.1:${APP_PORT}/" >/dev/null 2>&1; then
              HEALTH_OK=1
              break
            fi
            sleep 2
          done

          fi

          if [ "${HEALTH_OK}" -ne 1 ]; then
            echo "Health check failed, start rollback..."
            docker logs --tail 100 "${CONTAINER_NAME}" || true
            docker stop "${CONTAINER_NAME}" || true
            docker rm "${CONTAINER_NAME}" || true

            if [ -n "${PREV_IMAGE}" ]; then
              echo "Rollback to previous image: ${PREV_IMAGE}"
              docker run -d \
                --name "${CONTAINER_NAME}" \
                --network "${NETWORK_NAME}" \
                --network-alias "qlume" \
                --restart unless-stopped \
                -p ${HOST_PORT}:${APP_PORT} \
                "${PREV_IMAGE}"
              echo "Deployment rolled back."
              docker ps --filter "name=${CONTAINER_NAME}" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}\t{{.Image}}"
            else
              echo "No previous image available, rollback skipped." >&2
            fi
            exit 1
          fi

          echo "Done. Current status:"
          docker ps --filter "name=${CONTAINER_NAME}" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}\t{{.Image}}"
          REMOTE_SCRIPT

      - name: Cleanup runner artifacts
        if: always()
        shell: bash
        run: |
          if [ -n "${ARTIFACT_DIR:-}" ]; then rm -rf -- "$ARTIFACT_DIR"; fi
