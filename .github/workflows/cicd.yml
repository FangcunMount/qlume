name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      deploy:
        description: "是否部署到 ServerD（只允许 main/master 分支）"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: qlume-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/fangcunmount/qlume
  IMAGE_DOCKERHUB: fangcunmount/qlume
  DOCKERFILE: build/Dockerfile

jobs:
  validate-secrets:
    name: Validate Secrets
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check required secrets
        shell: bash
        env:
          # HOST/USERNAME/PORT 优先用 org Variables，SSH 密钥仍走 Secrets
          SVRD_HOST: ${{ vars.SVRD_HOST || secrets.SVRD_HOST }}
          SVRD_USERNAME: ${{ vars.SVRD_USERNAME || secrets.SVRD_USERNAME }}
          SVRD_SSH_KEY: ${{ secrets.SVRD_SSH_KEY }}
          SVRD_SSH_PORT: ${{ vars.SVRD_SSH_PORT || secrets.SVRD_SSH_PORT }}
          SVRD_SUDO_PASSWORD: ${{ secrets.SVRD_SUDO_PASSWORD }}
          APP_PORT_SERVERD: ${{ secrets.APP_PORT_SERVERD || vars.APP_PORT_SERVERD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          ENFORCE_REQUIRED=0
          VALIDATION_FAILED=0

          if [ "${GITHUB_REF}" = "refs/heads/main" ] || [ "${GITHUB_REF}" = "refs/heads/master" ]; then
            ENFORCE_REQUIRED=1
            echo "main/master 分支：严格校验部署必需配置"
          else
            echo "非 main/master 分支：仅提示缺失，不阻断"
          fi

          REQUIRED_SECRETS=(SVRD_HOST SVRD_USERNAME SVRD_SSH_KEY)
          OPTIONAL_SECRETS=(SVRD_SSH_PORT SVRD_SUDO_PASSWORD APP_PORT_SERVERD DOCKERHUB_USERNAME DOCKERHUB_TOKEN)

          for SECRET_NAME in "${REQUIRED_SECRETS[@]}"; do
            VALUE="${!SECRET_NAME:-}"
            if [ -n "$VALUE" ]; then
              echo "OK: ${SECRET_NAME} is set"
            else
              if [ "$ENFORCE_REQUIRED" -eq 1 ]; then
                echo "ERROR: ${SECRET_NAME} is not set"
                VALIDATION_FAILED=1
              else
                echo "WARN: ${SECRET_NAME} is not set (required on main/master deploy)"
              fi
            fi
          done

          for SECRET_NAME in "${OPTIONAL_SECRETS[@]}"; do
            VALUE="${!SECRET_NAME:-}"
            if [ -n "$VALUE" ]; then
              echo "OK: ${SECRET_NAME} is set"
            else
              case "$SECRET_NAME" in
                SVRD_SSH_PORT)
                  echo "WARN: ${SECRET_NAME} is not set, fallback to 22"
                  ;;
                APP_PORT_SERVERD)
                  echo "WARN: ${SECRET_NAME} is not set, fallback to 3001"
                  ;;
                DOCKERHUB_TOKEN|DOCKERHUB_USERNAME)
                  echo "WARN: ${SECRET_NAME} is not set — GHCR 失败时无法回退 Docker Hub"
                  ;;
                *)
                  echo "WARN: ${SECRET_NAME} is not set (optional)"
                  ;;
              esac
            fi
          done

          if [ "$ENFORCE_REQUIRED" -eq 1 ] && [ "$VALIDATION_FAILED" -eq 1 ]; then
            echo "Secrets validation failed."
            exit 1
          fi
          echo "Secrets validation passed."

  test_lint:
    name: Test And Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker_build_push:
    name: Build And Push Image
    needs: [validate-secrets, test_lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: image_meta
        shell: bash
        run: |
          set -Eeuo pipefail
          TAGS="${IMAGE}:sha-${GITHUB_SHA}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ] || [ "${GITHUB_REF}" = "refs/heads/master" ]; then
            TAGS="${TAGS}"$'\n'"${IMAGE}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build And Push GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: ${{ steps.image_meta.outputs.tags }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_REF=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Mirror image to Docker Hub (optional)
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "Docker Hub credentials missing, skip mirror."
            exit 0
          fi
          if ! echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin; then
            echo "Docker Hub login failed, skip mirror."
            exit 0
          fi
          if ! docker buildx imagetools create -t "${IMAGE_DOCKERHUB}:sha-${GITHUB_SHA}" "${IMAGE}:sha-${GITHUB_SHA}"; then
            echo "Mirror sha tag failed, keep GHCR as source of truth."
            exit 0
          fi
          if [ "${GITHUB_REF}" = "refs/heads/main" ] || [ "${GITHUB_REF}" = "refs/heads/master" ]; then
            if ! docker buildx imagetools create -t "${IMAGE_DOCKERHUB}:latest" "${IMAGE}:latest"; then
              echo "Mirror latest tag failed, keep GHCR as source of truth."
              exit 0
            fi
          fi

  deploy_serverd:
    name: Deploy To ServerD
    needs: [docker_build_push]
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64]
    permissions:
      contents: read
      packages: read
    environment: production
    concurrency:
      group: qlume-production
      cancel-in-progress: false
    if: |
      ((github.event_name == 'push') &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      ((github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == true) &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    steps:
      - name: Login GHCR (isolated config, no keychain)
        shell: bash
        env:
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          # macOS 上 docker login 即使 config 没配 credsStore，只要 PATH 里有
          # docker-credential-osxkeychain 也会默认走钥匙串，无 GUI 会话会失败
          # (-25308)。因此不跑 docker login，直接把 auth 写进隔离配置。
          DOCKER_CONFIG_DIR="${RUNNER_TEMP}/docker-config-${GITHUB_RUN_ID}"
          mkdir -p "${DOCKER_CONFIG_DIR}"
          AUTH="$(printf '%s:%s' "${GH_USER}" "${GH_TOKEN}" | base64 | tr -d '\n')"
          umask 077
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "${AUTH}" > "${DOCKER_CONFIG_DIR}/config.json"
          echo "DOCKER_CONFIG=${DOCKER_CONFIG_DIR}" >> "${GITHUB_ENV}"

      - name: Prepare SSH key
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SVRD_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -lf ~/.ssh/id_ed25519

      - name: Pull image on runner and export bundle
        env:
          IMAGE_REF: ${{ env.IMAGE }}:sha-${{ github.sha }}
        run: |
          set -Eeuo pipefail
          # Mac Runner 为 ARM64，serverD 为 linux/amd64，必须指定平台
          docker pull --platform linux/amd64 "${IMAGE_REF}"
          docker save "${IMAGE_REF}" | gzip -1 > /tmp/qlume-image.tar.gz
          ls -lh /tmp/qlume-image.tar.gz

      - name: Upload image bundle to ServerD
        shell: bash
        env:
          HOST: ${{ vars.SVRD_HOST || secrets.SVRD_HOST }}
          USER: ${{ vars.SVRD_USERNAME || secrets.SVRD_USERNAME }}
          PORT: ${{ vars.SVRD_SSH_PORT || secrets.SVRD_SSH_PORT || 22 }}
        run: |
          set -Eeuo pipefail
          scp -i ~/.ssh/id_ed25519 -P "${PORT}" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            /tmp/qlume-image.tar.gz "${USER}@${HOST}:/tmp/qlume-image.tar.gz"

      - name: Deploy to ServerD
        shell: bash
        env:
          HOST: ${{ vars.SVRD_HOST || secrets.SVRD_HOST }}
          USER: ${{ vars.SVRD_USERNAME || secrets.SVRD_USERNAME }}
          PORT: ${{ vars.SVRD_SSH_PORT || secrets.SVRD_SSH_PORT || 22 }}
          SUDO_PASSWORD: ${{ secrets.SVRD_SUDO_PASSWORD }}
          IMAGE: ${{ env.IMAGE }}
          IMAGE_SHA: ${{ github.sha }}
          APP_PORT_SERVERD: ${{ secrets.APP_PORT_SERVERD || vars.APP_PORT_SERVERD }}
        run: |
          set -Eeuo pipefail

          SSH_OPTS="-i ~/.ssh/id_ed25519 -p ${PORT} -o BatchMode=yes -o StrictHostKeyChecking=accept-new"
          echo "Connecting to ${USER}@${HOST}:${PORT}"

          cat <<'REMOTE_SCRIPT' | ssh ${SSH_OPTS} "${USER}@${HOST}" "IMAGE=${IMAGE} IMAGE_SHA=${IMAGE_SHA} APP_PORT_SERVERD='${APP_PORT_SERVERD}' SUDO_PASSWORD='${SUDO_PASSWORD}' bash -s"
          set -Eeuo pipefail

          CONTAINER_NAME="qlume"
          NETWORK_NAME="infra-network"
          IMAGE_NAME="${IMAGE}:sha-${IMAGE_SHA}"
          BUNDLE="/tmp/qlume-image.tar.gz"
          APP_PORT="3000"
          HOST_PORT="${APP_PORT_SERVERD:-3001}"
          PREV_IMAGE=""
          USE_IMAGE="${IMAGE_NAME}"

          if sudo -n true 2>/dev/null; then
            SUDO="sudo"
          else
            if [ -z "${SUDO_PASSWORD:-}" ]; then
              echo "sudo 需要密码，但没有配置 SVRD_SUDO_PASSWORD" >&2
              exit 1
            fi
            sudo_pw() { sudo -S "$@" <<<"$SUDO_PASSWORD"; }
            export -f sudo_pw
            SUDO="sudo_pw"
            $SUDO -v || true
          fi

          if ! command -v docker >/dev/null 2>&1; then
            echo "ServerD 缺少 docker，无法部署容器" >&2
            exit 1
          fi

          if [ ! -f "${BUNDLE}" ]; then
            echo "未找到镜像包 ${BUNDLE}" >&2
            exit 1
          fi
          if ! gzip -t "${BUNDLE}" 2>/dev/null; then
            echo "镜像包损坏或未传完整（gzip 校验失败）" >&2
            exit 1
          fi

          TEMP_TAR="$(mktemp)"
          gunzip -c "${BUNDLE}" > "${TEMP_TAR}"
          $SUDO docker load -i "${TEMP_TAR}"
          rm -f "${TEMP_TAR}" "${BUNDLE}"

          if ! $SUDO docker network ls --format '{{.Name}}' | grep -q "^${NETWORK_NAME}$"; then
            echo "Network ${NETWORK_NAME} not found. Initialize ServerD Swarm/infra-network first." >&2
            exit 1
          fi

          if $SUDO docker ps -a --format '{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then
            PREV_IMAGE="$($SUDO docker inspect --format '{{.Config.Image}}' "${CONTAINER_NAME}" 2>/dev/null || true)"
            if [ -n "${PREV_IMAGE}" ]; then
              echo "Previous image detected: ${PREV_IMAGE}"
            fi
            $SUDO docker stop "${CONTAINER_NAME}" || true
            $SUDO docker rm "${CONTAINER_NAME}" || true
          fi

          echo "Run container: ${CONTAINER_NAME}"
          $SUDO docker run -d \
            --name "${CONTAINER_NAME}" \
            --network "${NETWORK_NAME}" \
            --network-alias "qlume" \
            --restart unless-stopped \
            -p ${HOST_PORT}:${APP_PORT} \
            "${USE_IMAGE}"

          echo "Health check (docker exec -> http://127.0.0.1:${APP_PORT}/)..."
          HEALTH_OK=0
          sleep 5
          for i in $(seq 1 45); do
            if $SUDO docker exec "${CONTAINER_NAME}" wget -qO- -T 3 "http://127.0.0.1:${APP_PORT}/" >/dev/null 2>&1; then
              HEALTH_OK=1
              break
            fi
            sleep 2
          done

          if [ "${HEALTH_OK}" -ne 1 ]; then
            echo "Health check failed, start rollback..."
            $SUDO docker logs --tail 100 "${CONTAINER_NAME}" || true
            $SUDO docker stop "${CONTAINER_NAME}" || true
            $SUDO docker rm "${CONTAINER_NAME}" || true

            if [ -n "${PREV_IMAGE}" ]; then
              echo "Rollback to previous image: ${PREV_IMAGE}"
              $SUDO docker run -d \
                --name "${CONTAINER_NAME}" \
                --network "${NETWORK_NAME}" \
                --network-alias "qlume" \
                --restart unless-stopped \
                -p ${HOST_PORT}:${APP_PORT} \
                "${PREV_IMAGE}"
              echo "Deployment rolled back."
              $SUDO docker ps --filter "name=${CONTAINER_NAME}" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}\t{{.Image}}"
            else
              echo "No previous image available, rollback skipped." >&2
            fi
            exit 1
          fi

          echo "Done. Current status:"
          $SUDO docker ps --filter "name=${CONTAINER_NAME}" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}\t{{.Image}}"
          REMOTE_SCRIPT

      - name: Cleanup runner artifacts
        if: always()
        shell: bash
        run: |
          rm -f /tmp/qlume-image.tar.gz ~/.ssh/id_ed25519
          rm -rf "${DOCKER_CONFIG}" 2>/dev/null || true
          docker image prune -f >/dev/null 2>&1 || true
