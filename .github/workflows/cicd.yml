name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      deploy:
        description: "是否部署到 ServerB（只允许 main/master 分支）"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: qlume-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-secrets:
    name: Validate Secrets
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check required secrets
        shell: bash
        env:
          SVRB_HOST: ${{ secrets.SVRB_HOST }}
          SVRB_USERNAME: ${{ secrets.SVRB_USERNAME }}
          SVRB_SSH_KEY: ${{ secrets.SVRB_SSH_KEY }}
          SVRB_SSH_PORT: ${{ secrets.SVRB_SSH_PORT }}
          SVRB_SUDO_PASSWORD: ${{ secrets.SVRB_SUDO_PASSWORD }}
          DEPLOY_PATH_SERVERB: ${{ secrets.DEPLOY_PATH_SERVERB }}
          SVRB_POST_DEPLOY_COMMAND: ${{ secrets.SVRB_POST_DEPLOY_COMMAND }}
        run: |
          set -Eeuo pipefail

          ENFORCE_REQUIRED=0
          VALIDATION_FAILED=0

          if [ "${GITHUB_REF}" = "refs/heads/main" ] || [ "${GITHUB_REF}" = "refs/heads/master" ]; then
            ENFORCE_REQUIRED=1
            echo "main/master 分支：严格校验 ServerB 部署 secrets"
          else
            echo "非 main/master 分支：仅提示缺失，不阻断流程"
          fi

          REQUIRED_SECRETS=(SVRB_HOST SVRB_USERNAME SVRB_SSH_KEY)
          OPTIONAL_SECRETS=(SVRB_SSH_PORT SVRB_SUDO_PASSWORD DEPLOY_PATH_SERVERB SVRB_POST_DEPLOY_COMMAND)

          for SECRET_NAME in "${REQUIRED_SECRETS[@]}"; do
            VALUE="${!SECRET_NAME:-}"
            if [ -n "$VALUE" ]; then
              echo "OK: ${SECRET_NAME} is set"
            else
              if [ "$ENFORCE_REQUIRED" -eq 1 ]; then
                echo "ERROR: ${SECRET_NAME} is not set"
                VALIDATION_FAILED=1
              else
                echo "WARN: ${SECRET_NAME} is not set (required on main/master deploy)"
              fi
            fi
          done

          for SECRET_NAME in "${OPTIONAL_SECRETS[@]}"; do
            VALUE="${!SECRET_NAME:-}"
            if [ -n "$VALUE" ]; then
              echo "OK: ${SECRET_NAME} is set"
            else
              case "$SECRET_NAME" in
                DEPLOY_PATH_SERVERB)
                  echo "WARN: ${SECRET_NAME} is not set, fallback to /data/www/www.fangcunmount.cn"
                  ;;
                SVRB_SSH_PORT)
                  echo "WARN: ${SECRET_NAME} is not set, fallback to 22"
                  ;;
                *)
                  echo "WARN: ${SECRET_NAME} is not set (optional)"
                  ;;
              esac
            fi
          done

          if [ "$ENFORCE_REQUIRED" -eq 1 ] && [ "$VALIDATION_FAILED" -eq 1 ]; then
            echo "Secrets validation failed."
            exit 1
          fi

          echo "Secrets validation passed."

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: qlume-dist
          path: dist
          if-no-files-found: error

  deploy_serverb:
    name: Deploy to ServerB
    needs: [validate-secrets, build]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: qlume-production
      cancel-in-progress: true
    if: |
      ((github.event_name == 'push') &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      ((github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == true) &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: qlume-dist
          path: .artifacts/qlume-dist

      - name: Install deployment dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y openssh-client

      - name: Prepare SSH key
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SVRB_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -lf ~/.ssh/id_ed25519

      - name: Create site bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          find .artifacts/qlume-dist -maxdepth 2 -type f | sort
          tar -C .artifacts/qlume-dist -czf /tmp/qlume-site.tar.gz .
          ls -lh /tmp/qlume-site.tar.gz

      - name: Upload site bundle to ServerB
        shell: bash
        env:
          HOST: ${{ secrets.SVRB_HOST }}
          USER: ${{ secrets.SVRB_USERNAME }}
          PORT: ${{ secrets.SVRB_SSH_PORT || 22 }}
        run: |
          set -Eeuo pipefail
          scp -i ~/.ssh/id_ed25519 -P "${PORT}" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            /tmp/qlume-site.tar.gz "${USER}@${HOST}:/tmp/qlume-site.tar.gz"

      - name: Deploy to ServerB
        shell: bash
        env:
          HOST: ${{ secrets.SVRB_HOST }}
          USER: ${{ secrets.SVRB_USERNAME }}
          PORT: ${{ secrets.SVRB_SSH_PORT || 22 }}
          SUDO_PASSWORD: ${{ secrets.SVRB_SUDO_PASSWORD }}
          DEPLOY_PATH_SERVERB: ${{ secrets.DEPLOY_PATH_SERVERB }}
          SVRB_POST_DEPLOY_COMMAND: ${{ secrets.SVRB_POST_DEPLOY_COMMAND }}
        run: |
          set -Eeuo pipefail

          TARGET_PATH="${DEPLOY_PATH_SERVERB:-/data/www/www.fangcunmount.cn}"
          SSH_OPTS="-i ~/.ssh/id_ed25519 -p ${PORT} -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          echo "Connecting to ${USER}@${HOST}:${PORT}"

          cat <<'REMOTE_SCRIPT' | ssh ${SSH_OPTS} "${USER}@${HOST}" "TARGET_PATH='${TARGET_PATH}' SUDO_PASSWORD='${SUDO_PASSWORD}' POST_DEPLOY_COMMAND='${SVRB_POST_DEPLOY_COMMAND}' bash -s"
          set -Eeuo pipefail

          BUNDLE="/tmp/qlume-site.tar.gz"
          RELEASE_DIR="$(mktemp -d)"
          trap 'rm -rf "${RELEASE_DIR}" "${BUNDLE}"' EXIT

          if sudo -n true 2>/dev/null; then
            SUDO="sudo"
          else
            if [ -z "${SUDO_PASSWORD:-}" ]; then
              echo "sudo 需要密码，但没有配置 SVRB_SUDO_PASSWORD" >&2
              exit 1
            fi
            sudo_pw() { sudo -S "$@" <<<"$SUDO_PASSWORD"; }
            export -f sudo_pw
            SUDO="sudo_pw"
            $SUDO -v || true
          fi

          if [ ! -f "${BUNDLE}" ]; then
            echo "未找到站点包 ${BUNDLE}" >&2
            exit 1
          fi

          if ! gzip -t "${BUNDLE}" 2>/dev/null; then
            echo "站点包损坏或未传完整（gzip 校验失败）" >&2
            exit 1
          fi

          if ! command -v rsync >/dev/null 2>&1; then
            echo "ServerB 缺少 rsync，无法发布静态文件" >&2
            exit 1
          fi

          tar -xzf "${BUNDLE}" -C "${RELEASE_DIR}"

          $SUDO mkdir -p "${TARGET_PATH}"
          $SUDO rsync -a --delete --chmod=D755,F644 "${RELEASE_DIR}/" "${TARGET_PATH}/"

          if [ -n "${POST_DEPLOY_COMMAND:-}" ]; then
            $SUDO bash -lc "${POST_DEPLOY_COMMAND}"
          fi

          echo "Site deployed to ${TARGET_PATH}"
          REMOTE_SCRIPT
